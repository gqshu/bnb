[project]
name = "bnb"
version = "0.1.0"
description = "Backend for an EEG-adaptive binaural beats product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "soundfile>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
