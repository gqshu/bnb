[project]
name = "bnb"
version = "0.1.0"
description = "Backend for an EEG-adaptive binaural beats product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.58.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lameenc>=1.8.4",
    "numpy>=2.1",
    "soundfile>=0.13",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
media = [
    "elevenlabs>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Model renders are minutes-long and download GB-scale weights; opt in with `-m slow`.
addopts = "-m 'not slow'"
markers = ["slow: runs a real audio model (needs the stable-audio-3 checkout)"]
